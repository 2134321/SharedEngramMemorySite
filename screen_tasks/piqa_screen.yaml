# PIQA as lm-evaluation-harness 0.4.13 defines it (piqa/piqa.yaml), scored on the train split: run.py's
# benchmarks use every validation question.
task: piqa_screen
dataset_path: baber/piqa
dataset_name: null
output_type: multiple_choice
training_split: null
validation_split: train
test_split: null
doc_to_text: "Question: {{goal}}\nAnswer:"
doc_to_target: label
doc_to_choice: "{{[sol1, sol2]}}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
